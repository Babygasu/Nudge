name: Build dev APK

# Development builds use Android's standard debug signing. No signing secrets are needed.
# The debug certificate is generated fresh on each CI runner, so it can differ between builds:
# installing a newer build may require uninstalling the previous one (this erases its test data).
# Stable signing is deferred until we prepare stable releases (see docs/SIGNING.md).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build job (which runs repository and pull-request code)
# can only read. Only the separate publish job may create releases.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -q "CN=Android Debug" certs.txt || { echo "::error::APK is not signed with the standard Android debug certificate"; exit 1; }
          FINGERPRINT=$(grep -m1 "certificate SHA-256 digest" certs.txt | awk '{print $NF}')
          mkdir -p out
          cp "$APK" "out/nudge-dev-${{ github.run_number }}.apk"
          echo "$FINGERPRINT" > out/certificate-sha256.txt
          echo "Debug certificate SHA-256: $FINGERPRINT"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudge-dev-${{ github.run_number }}
          path: out/
          retention-days: 30

  # Publishes the APK as a GitHub pre-release so it can be downloaded directly on the phone.
  # Runs only for pushes to this repository (never for pull requests), checks out no code,
  # and only handles the already-built APK.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nudge-dev-${{ github.run_number }}
          path: out

      - name: Create development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          FINGERPRINT=$(cat out/certificate-sha256.txt)
          SHORT_SHA="${GITHUB_SHA::7}"
          cat > notes.md <<EOF
          ⚠️ **Development / testing build. Not a stable release.**

          - Build ${RUN} from branch ${BRANCH} (commit ${SHORT_SHA}).
          - Signed with a temporary Android debug key. If installing it over an older Nudge build fails
            with "App not installed" or "package conflicts", uninstall **Nudge (debug)** first.
            This erases its test reminders.
          - For testing only. Don't rely on it for real reminders yet.

          **Install:** on your Android phone, download nudge-dev-${RUN}.apk below and open it.
          Allow your browser to install apps if asked. Guide: docs/INSTALL_AND_TEST.md

          Debug certificate SHA-256: ${FINGERPRINT}
          EOF
          gh release create "dev-${RUN}" "out/nudge-dev-${RUN}.apk" \
            --target "$GITHUB_SHA" \
            --title "Nudge DEV build ${RUN} (testing only)" \
            --notes-file notes.md \
            --prerelease
